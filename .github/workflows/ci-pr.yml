name: CI PR — Quality Gate

# Gitleaks + dependency review + Helm lint on every PR to main.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    needs: gitleaks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          for chart in ingress-nginx cert-manager-clusterissuer tailscale-operator syesite-chart hello-world kuberflow; do
            echo "──────── $chart ────────"
            helm dependency update "$chart" 2>/dev/null || true
            helm lint "$chart"
          done
