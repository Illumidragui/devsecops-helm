# Values for the wrapper chart's own template (templates/namespace.yaml).
namespace: ingress-nginx

# Overrides for the real upstream ingress-nginx chart declared as a dependency
# in Chart.yaml — must be nested under this key (the dependency name) to reach it.
ingress-nginx:
  controller:
    # Disables the admission webhook cert-generator Job (and the
    # ValidatingWebhookConfiguration it populates). That Job's PreSync hook
    # (helm.sh/hook-delete-policy: before-hook-creation) gets ArgoCD stuck
    # forever waiting to "delete" a Job that was never created in the first
    # place (ArgoCD logs it as nil->obj yet still reports "Pending deletion").
    # Not needed for a single-node personal lab without strict Ingress validation.
    admissionWebhooks:
      enabled: false
