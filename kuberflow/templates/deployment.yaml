apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuberflow.fullname" . }}
  labels:
    {{- include "kuberflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kuberflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kuberflow.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: {{ include "kuberflow.fullname" . }}-html
